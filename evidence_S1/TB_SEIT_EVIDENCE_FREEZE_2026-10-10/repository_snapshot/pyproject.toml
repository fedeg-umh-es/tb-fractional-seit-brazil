[project]
name = "tb-fractional-seit-brazil"
version = "0.0.0"
description = "Independent reproducibility audit of a fractional-order SEIT TB model for Brazil"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "openpyxl",
    "matplotlib",
    "statsmodels",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
